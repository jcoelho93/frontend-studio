name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Structural and script checks
        run: node tests/validate.mjs
      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate .
      - name: Manifest versions agree
        run: |
          a=$(jq -r .version .claude-plugin/plugin.json)
          b=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          [ "$a" = "$b" ] || { echo "plugin.json ($a) != marketplace.json ($b)"; exit 1; }
